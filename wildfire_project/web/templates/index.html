<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="10" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildfire CCTV Dashboard</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    /* === CCTV 이미지 그리드 === */
    .image-grid-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      justify-content: flex-start;
    }

    .cctv-wrapper {
      position: relative;
      width: 256px;
      height: 256px;
    }

    .cctv-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .zone-label-top {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255, 255, 255, 0.8);
      color: black;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* === Fire 판단 이미지 카드 === */
    .fire-section {
      background: #111;
      padding: 20px;
      color: white;
    }

    .fire-section h2 {
      margin-top: 0;
      font-size: 24px;
      color: red;
    }

    .fire-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
    }

    .fire-card {
      width: 250px;
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
      position: relative;
    }

    .fire-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .fire-info {
      padding: 10px;
      font-size: 14px;
    }

    .fire-info div {
      margin-bottom: 5px;
    }

    .zone-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255, 255, 255, 0.8);
      color: black;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .indicator-bar {
      height: 5px;
      background-color: red;
    }
  </style>
</head>
<body>

<div class="image-grid-top">
  {% for zone, images in grouped_images.items() %}
    {% for img in images %}
    <div class="cctv-wrapper">
      <img src="{{ url_for('serve_test_image', cls=img.cls_folder, filename=img.filename) }}" alt="Image" />
      <div class="zone-label-top">{{ img.zone }}</div>
    </div>
    {% endfor %}
  {% endfor %}
</div>

<div class="fire-section">
  <h2>🔥 Fire Detected</h2>
  <div class="fire-grid">
    {% for zone, images in grouped_images.items() %}
      {% for img in images %}
        {% if img.pred == 'fire' %}
        <div class="fire-card">
          <div class="zone-label">{{ img.zone }}</div>
          <img src="{{ url_for('serve_test_image', cls=img.cls_folder, filename=img.filename) }}" alt="Fire Image" />
          <div class="indicator-bar"></div>
        </div>
        {% endif %}
      {% endfor %}
    {% endfor %}
  </div>
</div>

</body>
</html>
